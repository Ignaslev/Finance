{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Login" %} · MoneyCoach{% endblock %}
{% block content %}
<h2>{% trans "Login" %}</h2>
<form method="post">{% csrf_token %}
  <p><label>{% trans "Username" %} <input name="username"></label></p>
  <p><label>{% trans "Password" %} <input type="password" name="password"></label></p>
  <button>{% trans "Login" %}</button>
</form>
<p>{% trans "New here?" %} <a href="/register/">{% trans "Register" %}</a></p>
{% endblock %}
