{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Login" %} · MoneyCoach{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 2rem auto;">
    <h2 class="card-title">{% trans "Login" %}</h2>

    <form method="post" style="display:flex; flex-direction:column; gap:1rem;">
        {% csrf_token %}
        <div style="width:100%;">
            <label style="display:block; font-size:0.9rem; margin-bottom:0.25rem;">
                {% trans "Username" %}
            </label>
            <input name="username"
                   style="
                       width: 100%;
                       padding: 0.6rem 0.9rem;
                       border-radius: 8px;
                       border: 1px solid #e2e8f0;
                       font-family: inherit;
                       box-sizing: border-box;
                       background: #ffffff;
                   ">
        </div>

        <div style="width:100%;">
            <label style="display:block; font-size:0.9rem; margin-bottom:0.25rem;">
                {% trans "Password" %}
            </label>
            <input type="password" name="password"
                   style="
                       width: 100%;
                       padding: 0.6rem 0.9rem;
                       border-radius: 8px;
                       border: 1px solid #e2e8f0;
                       font-family: inherit;
                       box-sizing: border-box;
                       background: #ffffff;
                   ">
        </div>

        <button class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
            {% trans "Login" %}
        </button>
    </form>

    <p style="margin-top:1.25rem; font-size:0.9rem; text-align:center;">
        {% trans "New here?" %}
        <a href="/register/" style="color:var(--primary-teal); text-decoration:none; font-weight:600;">
            {% trans "Register" %}
        </a>
    </p>
</div>
{% endblock %}
