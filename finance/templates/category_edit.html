{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Edit category" %} · MoneyCoach{% endblock %}
{% block content %}
<h2>{% trans "Edit category" %}</h2>

<form method="post">
  {% csrf_token %}
  <p><label>{% trans "Name" %} <input name="name" value="{{ cat.name }}" required></label></p>
  <p><label>{% trans "Color" %} <input name="color" value="{{ cat.color }}" placeholder="#RRGGBB"></label></p>
  <p>
    <button>{% trans "Save" %}</button>
    <a href="/categories/" style="margin-left:.5rem">{% trans "Cancel" %}</a>
  </p>
</form>
{% endblock %}
