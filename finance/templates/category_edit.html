{% extends "base.html" %}
{% block title %}Edit category · MoneyCoach{% endblock %}
{% block content %}
<h2>Edit category</h2>

<form method="post">
  {% csrf_token %}
  <p><label>Name <input name="name" value="{{ cat.name }}" required></label></p>
  <p><label>Color <input name="color" value="{{ cat.color }}" placeholder="#RRGGBB"></label></p>
  <p>
    <button>Save</button>
    <a href="/categories/" style="margin-left:.5rem">Cancel</a>
  </p>
</form>
{% endblock %}
