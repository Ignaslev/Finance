{% extends "base.html" %}
{% block content %}
<h2>Teach AI</h2>
<p>Pick a category per merchant. This applies to all matching uncategorized transactions.</p>

<form method="post">
  {% csrf_token %}
  <table class="table">
    <thead><tr><th>Merchant</th><th>Flow</th><th>Occurrences</th><th>Category</th></tr></thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.merchant_display }}</td>
        <td>{{ r.flow|title }}</td>
        <td>{{ r.count }}</td>
        <td>
          <select name="{{ r.form_key }}">
            <option value="">— choose —</option>
            {% for c in categories %}
              <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <button class="btn btn-primary" type="submit">Apply</button>
</form>
{% endblock %}
