<meta name="robots" content="index,follow">

<link rel="alternate" hreflang="lt" href="{{ seo_alternate_lt_url }}">
<link rel="alternate" hreflang="en" href="{{ seo_alternate_en_url }}">
<link rel="alternate" hreflang="x-default" href="{{ seo_alternate_lt_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MoneyCompass">
<meta property="og:locale" content="{{ seo_locale }}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ seo_canonical_url }}">
<meta property="og:image" content="{{ seo_image_url }}">

<meta name="twitter:description" content="{{ seo_description }}">
