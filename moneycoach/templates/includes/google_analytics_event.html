{% if analytics_event_waiting %}
<script>
    window.moneyCompassHasPendingConsentEvent = true;
</script>
{% endif %}
{% if google_analytics_pending_event or meta_analytics_pending_event %}
<script>
    (function () {
        {% if google_analytics_pending_event %}
        if (typeof window.gtag === "function") {
            window.gtag("event", "{{ google_analytics_pending_event }}", {"method": "email"});
        }
        {% endif %}
        {% if meta_analytics_pending_event == "CompleteRegistration" %}
        if (typeof window.fbq === "function") {
            window.fbq("track", "CompleteRegistration", {"content_name": "MoneyCompass beta"});
        }
        {% endif %}
    }());
</script>
{% endif %}
