<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MoneyCoach{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem;
                 font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    header { display:flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    nav a { margin-right: .75rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f7f7f7; position: sticky; top: 0; }
    .pager a { margin: 0 .5rem; }
    .meta { color: #666; margin: .5rem 0 1rem; }
    .upload { margin: 1rem 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div><strong>MoneyCoach</strong></div>
    <nav>
      <a href="/overview/">Overview</a>
      <a href="/">Upload</a>
      <a href="/statistics/">Statistics</a>
      {% if request.user.is_authenticated %}
        <span style="color:#666">Hi, <a href="/profile/" style="margin-right:.75rem;">{{ request.user.username }}</a></span>
        <a href="/logout/">Logout</a>
      {% else %}
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
      {% endif %}
    </nav>
  </header>

  {% if messages %}
  <ul style="list-style:none;padding:0;margin:.5rem 0 1rem 0;">
    {% for message in messages %}
      <li style="margin:.5rem 0; padding:.5rem .75rem; border-radius:6px;
                 background:#e8f5e9; color:#2e7d32;">
        {{ message }}
      </li>
    {% endfor %}
  </ul>
  {% endif %}

  {% block content %}{% endblock %}
</div>
</body>
</html>
